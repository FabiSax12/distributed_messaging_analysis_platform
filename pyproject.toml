# uv virtual workspace: the root is not a package, it only ties the services
# together so they share one lockfile and one .venv.
#
#   uv sync --all-packages --group dataset
#   uv run --group dataset python dataset/generators/validate_manifests.py
[tool.uv.workspace]
members = [
    "services/shared",
    "services/coordinator",
    "services/workers",
    "services/storage",
]

[dependency-groups]
# Tools for dataset/ (manifest validation). Not part of any service.
dataset = [
    "jsonschema>=4.22",
]
dev = [
    "ruff>=0.6",
]
