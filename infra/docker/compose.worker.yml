# Production compose file for a worker node (AWS dev environment). One file for
# all pools: POOL selects the image (worker-<pool>) and the queue it consumes.
#
# Deployed by scripts/deploy/deploy-app.sh, which copies it to
# /opt/dmap/compose.yml on the instance next to two generated files:
#   .env     non-secret interpolation values (registry, tag, pool, ...)
#   app.env  application environment incl. credentials, built on the instance
#            from Secrets Manager (mode 600, never leaves the instance)
#
# Variables (from .env): ECR_REGISTRY, ECR_REPO_PREFIX, IMAGE_TAG, POOL
# (text|image|audio), AWS_REGION, LOG_GROUP, STOP_GRACE_PERIOD (optional).
name: dmap

services:
  worker:
    image: ${ECR_REGISTRY:?}/${ECR_REPO_PREFIX:?}/worker-${POOL:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: app.env
    environment:
      POOL: ${POOL:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # SIGTERM lets the current sub-task finish, so the grace period must exceed
    # the pool's op timeout (120 s text/image, 600 s audio).
    stop_grace_period: ${STOP_GRACE_PERIOD:-150s}
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?}
        awslogs-group: ${LOG_GROUP:?}
        tag: "{{.Name}}/{{.ID}}"
        mode: non-blocking
        max-buffer-size: 4m
