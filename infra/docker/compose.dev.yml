# Local stack for end-to-end runs: RabbitMQ, PostgreSQL and MinIO (S3).
# It mirrors what Terraform builds on AWS (Amazon MQ, RDS, S3); the
# coordinator and workers run on the host and point at it (see
# services/coordinator/README.md, "Running locally").
#
#   docker compose -f infra/docker/compose.dev.yml up -d --wait
#   docker compose -f infra/docker/compose.dev.yml down -v
#
# Credentials are local-only defaults, overridable through the environment.
# Host ports are shifted (5673, 15673, 5434, 9100, 9101) and bound to
# localhost so they do not clash with a RabbitMQ/PostgreSQL/MinIO already
# running on the default ports.
name: dmap-dev

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev}
    ports:
      - "127.0.0.1:5673:5672"     # AMQP
      - "127.0.0.1:15673:15672"   # management UI (dev/dev)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-dmap}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  # MinIO stopped publishing images on Docker Hub and quay.io; the frozen
  # Bitnami build still works and creates the bucket by itself.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devdevdev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devdevdev}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-dmap-dev}
    ports:
      - "127.0.0.1:9100:9000"   # S3 API
      - "127.0.0.1:9101:9001"   # console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
