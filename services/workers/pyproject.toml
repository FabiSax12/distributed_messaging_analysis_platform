[project]
name = "workers"
version = "0.1.0"
description = "Worker nodes: consume their pool queue from RabbitMQ, run the text/image/audio analysis ops and report every state change to the coordinator."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "psutil>=5.9",
    "storage",
]

[project.optional-dependencies]
image = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3,<9",
]
audio = [
    "av<19",
    "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "httpx>=0.27",  # scripts/local_e2e.py
]

[tool.uv.sources]
shared = { workspace = true }
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]

# ruff 0.16 (the one in uv.lock) sorts imports by default and, without this,
# treats `shared` as third-party. This gives the same grouping the
# coordinator uses: stdlib, third-party, `shared`, then the package itself.
[tool.ruff.lint.isort]
known-first-party = ["shared", "workers"]
