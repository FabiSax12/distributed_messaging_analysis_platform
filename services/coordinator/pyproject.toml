[project]
name = "coordinator"
version = "0.1.0"
description = "Coordinator node: plans subtasks, enqueues work, applies the case-closing barrier and exposes the dashboard REST API."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "python-ulid>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "httpx>=0.27",  # scripts/smoke.py
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinator"]
