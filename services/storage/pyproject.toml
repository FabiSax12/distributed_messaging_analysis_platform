[project]
name = "storage"
version = "0.1.0"
description = "M3 I/O and storage: chunked transfer with SHA-256 verification, content-addressed store with dedup, and bounded queues with backpressure."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["storage"]
